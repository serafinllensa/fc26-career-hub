<!doctype html><html lang="es-AR" data-tema="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel · FC26 Career Hub (maqueta)</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../tema-fc26.css"><script src="comun.js"></script>
<style>
.objetivo{display:flex;gap:var(--e3);align-items:flex-start;padding:var(--e3) 0;border-top:1px solid var(--linea)}
.objetivo:first-of-type{border-top:0}
.objetivo .ic{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--club-suave);color:var(--club-acento);font:800 15px/1 var(--f-display)}
.proximo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--e3);text-align:center;padding:var(--e3) 0}
.proximo .vs{font:800 var(--t-xl)/1 var(--f-display);color:var(--tinta-3)}
.rival{--c1:#D9D6CE;--c2:#B9B5AA;--ct:var(--tinta-2)}
.conf{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:var(--e3);margin:var(--e2) 0}
.conf b{font:700 var(--t-lg)/1 var(--f-display);text-align:right}
.lista-mini li{display:flex;align-items:center;gap:var(--e3);padding:8px 0;border-top:1px solid var(--linea)}
.lista-mini li:first-child{border-top:0}
.lista-mini{list-style:none;margin:0;padding:0}
.lineas{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:var(--e3) 0 var(--e2)}
.lineas span{display:block}
.aviso-ejemplo{display:flex;gap:var(--e2);align-items:center;font-size:var(--t-xs);color:var(--tinta-3);margin:0 0 var(--e4)}
</style></head><body><div class="app" id="app"></div>
<script>
(async()=>{
const club=await clubPorQuery(); aplicarClub(club);
const pl=await plantilla(club.id), J=pl.jugadores;
const M=await import('../../js/motor/index.js'); const obj=M.objetivos(club,'hardcore'), fin=M.finanzas(club,'hardcore').texto;
const rango=t=>t.replace(' (estimado)','').replace(' M€','');
const total=J.reduce((a,j)=>a+(j.valorM||0),0), edad=(J.reduce((a,j)=>a+j.edad,0)/J.length);
const cuenta={por:0,def:0,med:0,del:0}; J.forEach(j=>cuenta[lineaDe(j.pos)]++);
const vencen=J.filter(j=>j.contratoHasta && j.contratoHasta<='2027-06').sort((a,b)=>b.valorM-a.valorM);
const top=[...J].sort((a,b)=>b.valorM-a.valorM).slice(0,5);
const fecha=new Date(pl.fecha+'T12:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
document.getElementById('app').innerHTML=nav('panel')+`<main class="contenido">
${banda(club,'Hardcore',4,'<span class="badge neutro" style="background:rgba(255,255,255,.85);color:#15171C;border:0">Jornada 1 de 38</span>')}
<p class="aviso-ejemplo"><span class="badge ejemplo">Ejemplo</span> Objetivos y límites salen del Motor (dificultad Hardcore). Confianza y próximo partido son de ejemplo. La plantilla es real.</p>
<div class="grilla g-panel">
 <div class="grilla">
  <section class="tarjeta"><header><h2 class="h2">Próximo partido</h2><span class="badge ejemplo">Ejemplo</span></header>
   <div class="proximo"><div><div style="display:flex;justify-content:center;margin:0 auto 6px">${escudo(club)}</div><div class="h3">${club.nombre}</div><div class="meta">Local</div></div>
   <div class="vs">VS</div><div><div class="escudo rival" style="margin:0 auto 6px">?</div><div class="h3">Rival del calendario</div><div class="meta">Liga · Jornada 1</div></div></div>
   <div style="display:flex;gap:var(--e2);flex-wrap:wrap"><button class="btn club" style="flex:1 1 160px">Cargar resultado</button><button class="btn secundario" style="flex:1 1 160px">Ver calendario</button></div>
  </section>
  <section class="tarjeta"><header><h2 class="h2">Objetivos de la directiva</h2><span class="badge neutro">Motor</span></header>
   ${obj.map((o,i)=>`<div class="objetivo"><div class="ic">${i+1}</div><div style="flex:1"><div class="h3">${o.texto}</div><div class="meta">${o.principal?'Objetivo principal · si no se cumple, despido':'Exigido por la directiva'}</div></div><span class="badge ${o.principal?'peligro':'alerta'}">${o.principal?'Crítico':'Alto'}</span></div>`).join('')}
  </section>
  <section class="tarjeta"><header><h2 class="h2">La plantilla hoy</h2><a class="btn fantasma" href="plantilla.html?club=${club.id}" style="min-height:32px;padding:0 8px">Ver todo →</a></header>
   <div class="grilla g3" style="gap:var(--e3)">
    <div class="kpi"><div class="etiqueta">Valor de mercado</div><div class="valor num">${fmtVal(total)}<small>M€</small></div></div>
    <div class="kpi"><div class="etiqueta">Jugadores</div><div class="valor num">${J.length}</div><div class="det">Edad media ${edad.toLocaleString('es-AR',{maximumFractionDigits:1})}</div></div>
    <div class="kpi"><div class="etiqueta">Vencen en 2027</div><div class="valor num" style="color:var(--alerta)">${vencen.length}</div><div class="det">${vencen.map(j=>j.nombre.split(' ').slice(-1)[0]).join(', ')||'Ninguno'}</div></div>
   </div>
   <div class="lineas" aria-label="Jugadores por línea">${['por','def','med','del'].map(l=>`<span class="pos ${l}" style="flex:${cuenta[l]};min-width:0;padding:0;height:auto"></span>`).join('')}</div>
   <div class="meta num" style="display:flex;gap:var(--e4);flex-wrap:wrap"><span><span class="pos por" style="min-width:0;height:10px;width:10px;padding:0"></span> ${cuenta.por} POR</span><span><span class="pos def" style="min-width:0;height:10px;width:10px;padding:0"></span> ${cuenta.def} DEF</span><span><span class="pos med" style="min-width:0;height:10px;width:10px;padding:0"></span> ${cuenta.med} MED</span><span><span class="pos del" style="min-width:0;height:10px;width:10px;padding:0"></span> ${cuenta.del} DEL</span></div>
   <p class="fuente" style="margin:var(--e4) 0 0">Fuente: <a href="${pl.fuente}">Transfermarkt</a> · consulta ${fecha}</p>
  </section>
 </div>
 <div class="grilla" style="align-content:start">
  <section class="tarjeta"><header><h2 class="h2">Confianza</h2><span class="badge ejemplo">Ejemplo</span></header>
   <div class="conf"><span>Presidente</span><div class="medidor medio"><span style="width:45%"></span></div><b class="num">45</b></div>
   <div class="conf"><span>Vestuario</span><div class="medidor"><span style="width:68%"></span></div><b class="num">68</b></div>
   <div class="conf"><span>Hinchas</span><div class="medidor"><span style="width:72%"></span></div><b class="num">72</b></div>
   <p class="meta" style="margin:var(--e3) 0 0">Ultimátum a los 3 partidos sin ganar.</p>
  </section>
  <section class="tarjeta"><header><h2 class="h2">Límites</h2><span class="badge estimado">Estimado</span></header>
   <div class="kpi"><div class="etiqueta">Presupuesto de fichajes</div><div class="valor num">${rango(fin.presupuesto)}<small>M€</small></div></div>
   <div class="kpi" style="margin-top:var(--e3)"><div class="etiqueta">Tope de masa salarial</div><div class="valor num">${rango(fin.topeSalarial)}<small>M€/año</small></div><div class="det">Hardcore: 10% menos que la masa actual</div></div>
   <a class="btn secundario" style="width:100%;margin-top:var(--e4)" href="presidente.html?club=${club.id}">Ir a la oficina del presidente</a>
  </section>
  <section class="tarjeta"><header><h2 class="h2">Los más valiosos</h2></header>
   <ul class="lista-mini">${top.map(j=>`<li><span class="pos ${lineaDe(j.pos)}">${j.pos}</span><span style="flex:1">${j.nombre}</span><b class="num">${fmtM(j.valorM)}</b></li>`).join('')}</ul>
  </section>
 </div>
</div>${PIE}</main>`;
})();
</script></body></html>
